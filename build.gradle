/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.net.datafaker.datafaker
    api libs.org.junit.platform.junit.platform.commons
    testImplementation libs.org.junit.jupiter.junit.jupiter.engine
    testImplementation libs.org.junit.jupiter.junit.jupiter.api
    testImplementation libs.org.junit.platform.junit.platform.engine
    testImplementation libs.org.junit.platform.junit.platform.launcher
    testImplementation libs.org.assertj.assertj.core
    testImplementation libs.org.mockito.mockito.core
    compileOnly libs.org.projectlombok.lombok
    annotationProcessor libs.org.projectlombok.lombok
    testRuntimeOnly libs.org.junit.platform.junit.platform.launcher
}

group = 'org.writer'
version = '1.0-SNAPSHOT'
description = 'csv'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
